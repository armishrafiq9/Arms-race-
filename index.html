
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARMS FIGHT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:white;font-family:Arial;text-align:center}
header{padding:20px;background:#102b4c}
h1{margin:0;color:#58b5ff;letter-spacing:3px}
#game{max-width:850px;margin:20px auto;padding:12px}
.hud{display:flex;justify-content:space-between;gap:10px;margin:12px 0}
.health{height:18px;background:#444;border-radius:20px;overflow:hidden;width:100%}
.fill{height:100%;background:#38d879;width:100%;transition:width .2s}
#arena{height:300px;background:linear-gradient(#173d65 0 65%,#263b52 65%);border:3px solid #58b5ff;border-radius:12px;position:relative;overflow:hidden}
.fighter{position:absolute;bottom:42px;width:65px;height:110px;border-radius:28px 28px 12px 12px}
#player{left:22%;background:#168bff}
#enemy{right:22%;background:#ed4444}
.head{position:absolute;width:48px;height:48px;border-radius:50%;background:#ffd2a6;top:-39px;left:8px}
.glove{position:absolute;width:38px;height:30px;background:#ffcc35;border-radius:18px;top:28px;right:-22px}
#enemy .glove{background:#ffb0b0;left:-22px}
#status{font-size:22px;font-weight:bold;margin:12px}
button{border:0;border-radius:10px;padding:13px 17px;margin:5px;background:#168bff;color:white;font-weight:bold;font-size:15px}
button:active{background:#0756a0}
#controls{display:flex;justify-content:center;flex-wrap:wrap}
#restart{background:#16a36a}
</style>
</head>
<body>
<header><h1>ARMS FIGHT</h1><p>THE ULTIMATE BOXING GAME</p></header>
<div id="game">
<div class="hud">
<div style="width:50%">BLUE PLAYER<div class="health"><div id="hp1" class="fill"></div></div></div>
<div style="width:50%">RED CPU<div class="health"><div id="hp2" class="fill"></div></div></div>
</div>
<div>Round <span id="round">1</span> / 3 &nbsp; | &nbsp; Time: <span id="time">60</span>s</div>
<div id="arena">
<div id="player" class="fighter"><div class="head"></div><div class="glove"></div></div>
<div id="enemy" class="fighter"><div class="head"></div><div class="glove"></div></div>
</div>
<div id="status">READY TO FIGHT?</div>
<div id="score">Blue 0 - 0 Red</div>
<div id="controls">
<button onclick="move(-1)">◀ MOVE</button>
<button onclick="punch()">👊 PUNCH</button>
<button onclick="block()">🛡 BLOCK</button>
<button onclick="dodge()">DODGE</button>
<button onclick="move(1)">MOVE ▶</button>
</div>
<button id="restart" onclick="start()">START / RESTART</button>
</div>
<script>
let p=100,e=100,round=1,blue=0,red=0,time=60,playing=false,guard=false,timer,ai;
const $=id=>document.getElementById(id);
function update(){
$('hp1').style.width=p+'%';$('hp2').style.width=e+'%';
$('round').textContent=round;$('time').textContent=time;
$('score').textContent=`Blue ${blue} - ${red} Red`;
}
function start(){
clearInterval(timer);clearInterval(ai);
p=100;e=100;round=1;blue=0;red=0;time=60;playing=true;
$('status').textContent='FIGHT!';
$('player').style.left='22%';$('enemy').style.right='22%';
update();
timer=setInterval(()=>{
if(!playing)return;
time--;
if(time<=0)endRound();
update();
},1000);
ai=setInterval(()=>{
if(!playing)return;
if(Math.random()<.65)damagePlayer();
},1800);
}
function punch(){
if(!playing)return;
$('status').textContent='PUNCH!';
if(Math.random()<.8){e=Math.max(0,e-12);$('enemy').style.transform='translateX(12px)'}
if(e<=0)endRound(true);
update();
}
function damagePlayer(){
if(!playing||guard)return;
p=Math.max(0,p-8);
$('player').style.transform='translateX(-10px)';
if(p<=0)endRound(false);
update();
}
function block(){
if(!playing)return;
guard=true;$('status').textContent='BLOCKING!';
setTimeout(()=>{guard=false;if(playing)$('status').textContent='FIGHT!'},900);
}
function dodge(){
if(!playing)return;
$('player').style.transform='translateY(-25px)';
setTimeout(()=>$('player').style.transform='',350);
}
function move(dir){
if(!playing)return;
let x=$('player').offsetLeft+dir*20;
$('player').style.left=Math.max(0,Math.min($('arena').clientWidth-65,x))+'px';
}
function endRound(won){
if(!playing)return;
playing=false;clearInterval(timer);clearInterval(ai);
if(won===true|| (won===undefined&&e<p))blue++;
else if(won===false|| (won===undefined&&p<e))red++;
update();
if(round<3){
$('status').textContent=`ROUND ${round} OVER!`;
setTimeout(()=>{
round++;p=100;e=100;time=60;playing=true;
$('status').textContent='FIGHT!';
update();
timer=setInterval(()=>{if(playing&&--time<=0)endRound();update()},1000);
ai=setInterval(()=>{if(playing&&Math.random()<.65)damagePlayer()},1800);
},1800);
}else{
$('status').textContent=blue>red?'🏆 BLUE WINS!':red>blue?'🏆 RED WINS!':'DRAW!';
}
}
</script>
</body>
</html>
